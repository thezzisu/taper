name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Kernel FUSE image workflow (simulated tapes only)
        run: |
          go test -c -race -o /tmp/taper-kernel.test ./cmd/taper
          go test -c -race -o /tmp/fusefs-kernel.test ./internal/fusefs
          sudo unshare --mount env TAPER_FUSE_KERNEL=1 /tmp/taper-kernel.test -test.run '^TestReplicaSyncEndpointWorkflow$' -test.v
          sudo unshare --mount env TAPER_FUSE_KERNEL=1 /tmp/fusefs-kernel.test -test.run '^TestKernel' -test.v
      - run: go test ./internal/format -run '^$' -fuzz FuzzFrame -fuzztime 10s
      - run: go test ./internal/format -run '^$' -fuzz FuzzGroup -fuzztime 10s
      - run: go build ./cmd/taper
