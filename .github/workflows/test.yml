name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test ./internal/format -run '^$' -fuzz FuzzFrame -fuzztime 10s
      - run: go test ./internal/format -run '^$' -fuzz FuzzGroup -fuzztime 10s
      - run: go build ./cmd/taper
